services:
  - name: virta7-ayaan-backend
    type: web
    runtime: node
    rootDir: virta7-server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    disk:
      name: virta7-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - name: virta7-ayaan-frontend
    type: web
    runtime: static
    rootDir: virta7
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://virta7-ayaan-backend.onrender.com/api
